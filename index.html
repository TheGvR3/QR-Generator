<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Modern QR Code Generator</title>
</head>
<body>

    <div class="background-blobs"></div>

    <nav class="navbar">
        <a href="https://portfolio-one-tan-70.vercel.app" class="nav-btn glass-btn" target="_blank">
            <span>👨‍💻</span>
            Portfolio
        </a>
    </nav>

    <div class="container">
        <header>
            <h1>QR Generator</h1>
            <p>Crea e condividi il tuo codice in un istante.</p>
        </header>

        <section class="qr-card">
            <div class="form-group">
                <input type="text" class="qr-text" placeholder="Inserisci testo o URL">
            </div>
            
            <div class="controls-row">
                <div class="color-wrapper">
                    <label>Colore</label>
                    <input type="color" class="light" value="#ffffff">
                </div>
                <div class="size-wrapper">
                    <label>Dimensione</label>
                    <select class="sizes">
                        <option value="100">100px</option>
                        <option value="200">200px</option>
                        <option value="300">300px</option>
                        <option selected value="400">400px</option>
                        <option value="500">500px</option>
                        <option value="600">600px</option>
                        <option value="700">700px</option>
                        <option value="800">800px</option>
                    </select>
                </div>
            </div>

            <div id="qr-code">
                </div>

            <div class="action-container">
                <a href="#" class="download btn primary-btn" download="QRCode">
                    <span>Download</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                </a>
                <button class="btn share-btn secondary-btn">
                    <span>Share</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                </button>
            </div>
        </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
